[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-guardrails"
version = "0.1.0"
description = "Input/output safety middleware for LLM applications, with a streaming filter that cannot leak across chunk boundaries"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Varun Kammadanam" }]
requires-python = ">=3.11"
keywords = [
    "llm",
    "guardrails",
    "pii-redaction",
    "prompt-injection",
    "json-schema",
    "streaming",
    "prometheus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# One runtime dependency, and only because policies are YAML. Everything else --
# detection, redaction, the schema validator, the metrics registry -- is standard
# library, so dropping this in front of a model does not drag a second
# dependency tree into a service that already has one.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
llmguard = "llmguard.cli:main"

[project.urls]
Homepage = "https://github.com/saivarun161/llm-guardrails"
Issues = "https://github.com/saivarun161/llm-guardrails/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llmguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff only honours .gitignore inside a git work tree; naming the virtualenv here
# keeps `ruff check .` clean in a bare checkout too.
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
files = ["src/llmguard"]
strict = true
# The package ships a py.typed marker, so these annotations are part of what a
# downstream service type-checks against rather than a private convenience.
# Anything short of strict would let an Any leak across that boundary and
# silently switch off checking in someone else's codebase.
warn_unreachable = true

[tool.coverage.run]
source = ["src/llmguard"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
